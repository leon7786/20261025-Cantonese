  <section class="poem-intro">
    <h2>聲調對粵語文化嘅塑造：協音與填詞</h2>
    <p>唐詩宋詞講究「平仄」：平聲悠長，仄聲短促。普通話因為「入派三聲」同濁音清化，讀某些古詩會唔押韻、平仄失調；粵語保留咗入聲同閉口韻，讀起上嚟頓挫分明，更接近當時嘅聲韻。</p>
    <p>下面十一首按順序排好，由《滿江紅》開始。點詩句或「粵語朗讀」聽全文，下面有簡短說明。</p>
