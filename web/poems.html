    <p>唐诗宋词讲究「平仄」：平声悠长，仄声短促。普通话因为「入派三声」同浊音清化，读某些古诗会唔押韵、平仄失调；粤语保留咗入声同闭口韵，读起上嚟顿挫分明，更接近当时嘅声韵。</p>
