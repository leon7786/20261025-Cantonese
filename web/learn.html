<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f7f4ee" />
<title>跟讀學粵語 · Cantonese TTS</title>
<meta name="description" content="整篇粵語短文，點邊句聽邊句，粵拼標在字上面。音頻已離線生成。" />
<link rel="stylesheet" href="/styles.css?v=20261027e" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗣️</text></svg>" />
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>

<header class="hero hero-compact">
  <div class="hero-inner">
    <nav class="topnav">
      <a class="brand" href="/">粵語 TTS 實驗室</a>
      <div class="navlinks">
        <a href="/">對比實驗室</a>
        <a href="/learn.html" class="active">跟讀學粵語</a>
      </div>
    </nav>
    <h1>跟讀學粵語</h1>
    <p class="lede">
      十四篇短文一次過顯示，粵拼標在字上面。點邊一句就播邊一句，音頻已經離線生成，唔使等、唔使 Key。
    </p>
  </div>
</header>

<main class="wrap">
  <div class="learn-layout">
    <aside class="lesson-sidebar" id="sidebar" aria-label="文章列表"></aside>

    <section class="learn-main">
      <div class="controlbar">
        <div class="controls-row">
          <button id="playPause" class="btn primary" type="button">播放</button>
          <button id="stop" class="btn ghost" type="button">停止</button>
          <button id="replay" class="btn ghost" type="button">重播</button>
          <span class="hint" id="status">點句子即播放</span>
        </div>
        <audio id="player" class="learn-player" controls preload="none"></audio>
      </div>

      <article class="learn-article">
        <header class="article-head">
          <h2 id="artTitle"></h2>
          <span class="article-tag" id="artTag"></span>
          <span class="article-meta" id="artMeta"></span>
        </header>
        <div class="prose" id="prose"></div>
      </article>

      <p class="disclaimer">
        音頻由 Qwen-Audio-3.0-TTS-Plus（女聲）一次性生成整篇，再按句號、逗號、感嘆號切段（少於 4 字會與下一句合併），已存放在本機，瀏覽時不呼叫 API。
        粵拼只作發音提示，個別字讀音可能有出入。
      </p>
    </section>
  </div>
</main>

<footer class="foot">
  <span>粵語 TTS 實驗室 · 跟讀頁</span>
  <span class="dot">·</span>
  <a href="/">返回對比實驗室</a>
  <span class="dot">·</span>

</footer>

<script src="/learn.js?v=20261027e" defer></script>
</body>
</html>
