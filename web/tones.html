    <h1>九聲六調，逐個字聽</h1>
    <p class="lede">
      唔想睇理論就直接點句聽；想知九聲係咩，再點開上面。易讀錯嘅字，下面有嘴型提示。
    </p>
  </div>
</header>

<main class="wrap">
  <details class="tone-legend">
    <summary class="tone-legend-summary">
      <span class="tl-title">九聲六調係咩？</span>
      <span class="tl-hint">點開睇九聲一覽</span>
    </summary>
    <div class="tone-legend-body">
      <div class="tone-legend-head">
        <h2>九聲六調</h2>
        <p>1–6 是平上去入的六個調，7–9 是三個入聲，音高分別同 1、3、6 相同，只是短促收尾。</p>
      </div>
      <div class="tone-scale">
        <div class="tone-cell"><b>1</b><span>高平</span><i>55</i><em>三 saam1</em></div>
        <div class="tone-cell"><b>2</b><span>高升</span><i>35</i><em>九 gau2</em></div>
        <div class="tone-cell"><b>3</b><span>中平</span><i>33</i><em>四 sei3</em></div>
        <div class="tone-cell"><b>4</b><span>低降</span><i>21</i><em>零 ling4</em></div>
        <div class="tone-cell"><b>5</b><span>低升</span><i>13</i><em>五 ng5</em></div>
        <div class="tone-cell"><b>6</b><span>低平</span><i>22</i><em>二 ji6</em></div>
        <div class="tone-cell"><b>7</b><span>高入</span><i>5</i><em>七 cat1</em></div>
        <div class="tone-cell"><b>8</b><span>中入</span><i>3</i><em>八 baat3</em></div>
        <div class="tone-cell"><b>9</b><span>低入</span><i>2</i><em>六 luk6</em></div>
      </div>
    </div>
  </details>

  <div id="sections"></div>
</main>
